# =============================================================================
# EDGES
# =============================================================================
edges:
  # ---------------------------------------------------------------------------
  # Value Chain Wiring
  # ---------------------------------------------------------------------------
  - source: corporate_finance
    target: free_cash_flow
    type: flows-to
  - source: corporate_finance
    target: dcf
    type: precedes

  # Unlevered Route (5 edges: free_cash_flow -> discount_rate -> enterprise_value -> net_debt -> equity_value -> per_share_value)
  - source: free_cash_flow
    target: discount_rate
    type: flows-to
  - source: discount_rate
    target: enterprise_value
    type: flows-to
  - source: enterprise_value
    target: net_debt
    type: flows-to
  - source: net_debt
    target: equity_value
    type: flows-to
  - source: equity_value
    target: per_share_value
    type: flows-to

  # Levered Route (3 edges: free_cash_flow -> discount_rate -> equity_value -> per_share_value)
  - source: discount_rate
    target: equity_value
    type: flows-to

  # ---------------------------------------------------------------------------
  # Precedence Chain Across Domains
  # ---------------------------------------------------------------------------
  - source: corporate_finance
    target: financial_statement_analysis
    type: precedes
  - source: financial_statement_analysis
    target: quantitative_methods
    type: precedes
  - source: quantitative_methods
    target: economics
    type: precedes
  - source: economics
    target: equity_investments
    type: precedes
  - source: equity_investments
    target: fixed_income
    type: precedes
  - source: fixed_income
    target: derivatives
    type: precedes
  - source: derivatives
    target: alternative_investments
    type: precedes
  - source: alternative_investments
    target: portfolio_management
    type: precedes
  - source: portfolio_management
    target: wealth_planning
    type: precedes
  - source: wealth_planning
    target: ethics_and_professional_standards
    type: precedes

  # ---------------------------------------------------------------------------
  # Build Coverage Links for Domains (domain -> build)
  # ---------------------------------------------------------------------------
  - source: corporate_finance
    target: dcf_model
    type: requires
  - source: financial_statement_analysis
    target: 3_statement_model
    type: requires
  - source: quantitative_methods
    target: monte_carlo_engine
    type: requires
  - source: economics
    target: capm_calculator
    type: requires
  - source: equity_investments
    target: lbo_model
    type: requires
  - source: fixed_income
    target: yield_curve_model
    type: requires
  - source: derivatives
    target: black_scholes_model
    type: requires
  - source: alternative_investments
    target: M_and_A_model
    type: requires
  - source: portfolio_management
    target: factor_risk_model
    type: requires
  - source: wealth_planning
    target: binomial_tree_model
    type: requires
  - source: ethics_and_professional_standards
    target: gips_report_builder
    type: requires

  # ---------------------------------------------------------------------------
  # Build Coverage Links for Instruments (instrument -> build)
  # ---------------------------------------------------------------------------
  - source: equity
    target: dcf_model
    type: requires
  - source: corporate_bond
    target: yield_curve_model
    type: requires
  - source: call_option
    target: black_scholes_model
    type: requires
  - source: interest_rate_swap
    target: factor_risk_model
    type: requires
  - source: treasury_bill
    target: capm_calculator
    type: requires

  # ---------------------------------------------------------------------------
