# Eval cases for question -> (start, goal) resolution and the roadmap built from it.
#
# Fields
#   id               unique case id
#   question         what the learner types
#   category         direct | alias | goal_only | paraphrase | cross_domain | regulated | out_of_scope
#   tier             alias = must resolve with exact matching alone (asserted offline in pytest)
#                    model = needs embeddings and/or the LLM (measured by evals/run.py only)
#   expected_status  ok (default) | regulated | out_of_scope
#   expected_start   list of acceptable start ids; omit when the start is not stated (defaulted)
#   expected_goal    list of acceptable goal ids (for regulated: the regulated activity)
#   path_must_include / path_must_exclude   node ids the roadmap must / must not contain
#
# Every roadmap, whatever the case, is also checked to contain no requires-registration activity.

cases:
  # ----------------------------------------------------------------- direct
  - id: direct-01
    question: "How do I get from free cash flow to per share value?"
    category: direct
    tier: alias
    expected_start: [free_cash_flow]
    expected_goal: [per_share_value]
    path_must_include: [discount_rate]

  - id: direct-02
    question: "What do I need to learn to go from the discount rate to enterprise value?"
    category: direct
    tier: alias
    expected_start: [discount_rate]
    expected_goal: [enterprise_value]

  - id: direct-03
    question: "I know DCF and want to learn the Black-Scholes model"
    category: direct
    tier: alias
    expected_start: [dcf]
    expected_goal: [black_scholes_model]

  - id: direct-04
    question: "Show me the path from the treasury bill to the CAPM calculator"
    category: direct
    tier: alias
    expected_start: [treasury_bill]
    expected_goal: [capm_calculator]

  - id: direct-05
    question: "How do I get from fixed income to derivatives?"
    category: direct
    tier: alias
    expected_start: [fixed_income]
    expected_goal: [derivatives]

  - id: direct-06
    question: "Roadmap from market efficiency to the capital asset pricing model"
    category: direct
    tier: alias
    expected_start: [market_efficiency]
    expected_goal: [capital_asset_pricing_model]

  - id: direct-07
    question: "From the 3-statement model to the LBO model, what is the order?"
    category: direct
    tier: alias
    expected_start: [3_statement_model]
    expected_goal: [lbo_model]
    path_must_include: [M_and_A_model]

  - id: direct-08
    question: "Path from Monte Carlo simulation to the Monte Carlo engine"
    category: direct
    tier: alias
    expected_start: [monte_carlo_simulation]
    expected_goal: [monte_carlo_engine]

  # ----------------------------------------------------------------- goal only
  - id: goal-01
    question: "How do I learn Black-Scholes?"
    category: goal_only
    tier: alias
    expected_goal: [black_scholes_model]
    path_must_include: [derivatives]

  - id: goal-02
    question: "What is a yield curve model and what do I need first?"
    category: goal_only
    tier: alias
    expected_goal: [yield_curve_model]

  - id: goal-03
    question: "Teach me about the CAPM"
    category: goal_only
    tier: alias
    expected_goal: [capital_asset_pricing_model]
    path_must_include: [market_efficiency]

  - id: goal-04
    question: "How do I build a DCF model?"
    category: goal_only
    tier: alias
    expected_goal: [dcf_model]

  - id: goal-05
    question: "What is net debt?"
    category: goal_only
    tier: alias
    expected_goal: [net_debt]

  - id: goal-06
    question: "How do I get started on the CFA charter?"
    category: goal_only
    tier: alias
    expected_goal: [cfa_charter, charter_route]

  # ----------------------------------------------------------------- alias / acronym
  - id: alias-01
    question: "WACC to per-share value, what is the route?"
    category: alias
    tier: alias
    expected_start: [discount_rate]
    expected_goal: [per_share_value]

  - id: alias-02
    question: "How do I go from FCF to EV?"
    category: alias
    tier: alias
    expected_start: [free_cash_flow]
    expected_goal: [enterprise_value]

  - id: alias-03
    question: "I understand TVM, how do I get to Monte Carlo?"
